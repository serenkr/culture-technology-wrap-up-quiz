<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GCT501 Exam Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: paper exam sheet on a grey desk; sticky black tab bar. Black & white, blue for key concepts, red wrong, green right. */
:root{
  --desk:#e9e9e7; --paper:#ffffff; --ink:#111111; --ink2:#4a4a4a; --ink3:#8a8a8a; --rule:#d6d6d6; --rule2:#ececec;
  --blue:#1546c9; --blue-bg:#eaf0ff; --red:#c4201b; --red-bg:#fdecea; --green:#167a36; --green-bg:#e7f5ec; --amber:#a86a00;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--desk);color:var(--ink);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--sans);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:8px;height:52px}
.brand{font-weight:900;letter-spacing:.02em;font-size:15px;margin-right:auto;white-space:nowrap}
.brand span{font-family:var(--mono);font-weight:600;opacity:.65;margin-left:6px;font-size:12px}
.tab{background:none;border:0;color:#cfcfcf;padding:6px 10px;border-radius:4px;font-weight:500;font-size:14px;white-space:nowrap}
.tab[aria-current="page"]{color:#fff;background:#2b2b2b}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;font-family:var(--mono)}
@media (max-width:480px){.brand span{display:none}.tab{padding:6px 7px;font-size:13.5px}.bar-in{gap:2px}}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px}
.sheet{max-width:900px;margin:0 auto;background:var(--paper);border:1px solid #cfcfcd;box-shadow:0 1px 0 #d9d9d7,0 10px 30px -18px rgba(0,0,0,.35);padding:40px 48px 48px}
@media (max-width:640px){.sheet{padding:24px 16px 32px}}
.sheet + .sheet{margin-top:24px}

.exam-head{border:2px solid var(--ink);display:grid;grid-template-columns:1fr auto}
.exam-head .t{padding:14px 18px;border-right:2px solid var(--ink);min-width:0}
.exam-head .t small{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.exam-head h1{margin:2px 0 0;font-size:24px;line-height:1.25;font-weight:900;text-wrap:balance}
.exam-head .meta{display:grid;grid-template-columns:auto auto;font-size:13px;min-width:240px}
.exam-head .meta div{padding:6px 12px;border-bottom:1px solid var(--ink)}
.exam-head .meta div:nth-child(odd){font-weight:700;border-right:1px solid var(--ink);background:#f4f4f4}
.exam-head .meta div:nth-last-child(-n+2){border-bottom:0}
@media (max-width:640px){.exam-head{grid-template-columns:1fr}.exam-head .t{border-right:0;border-bottom:2px solid var(--ink)}.exam-head h1{font-size:20px}.exam-head .meta{min-width:0}}
.instr{font-size:13.5px;color:var(--ink2);border-bottom:1px solid var(--ink);padding:10px 2px 12px;margin:0 0 8px}
.instr b{color:var(--ink)}
.part{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:34px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.part h2{margin:0;font-size:18px;font-weight:900}
.part span{font-size:13px;color:var(--ink2)}

.lede{font-size:15px;color:var(--ink2);max-width:66ch}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
@media (max-width:640px){.levels{grid-template-columns:1fr}}
.lv{border:1.5px solid var(--ink);background:#fff;text-align:left;padding:14px 16px;border-radius:2px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lv b{font-size:18px;font-weight:900}
.lv i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink2);letter-spacing:.05em}
.lv span{font-size:13px;color:var(--ink2)}
.lv[aria-pressed="true"]{background:var(--ink);color:#fff}
.lv[aria-pressed="true"] i,.lv[aria-pressed="true"] span{color:#d8d8d8}
.opts-row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:4px 0 18px;font-size:14px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:13.5px}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;padding:9px 18px;border-radius:2px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13px;font-weight:500}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stat{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}

.q{padding:22px 0 20px;border-bottom:1px solid var(--rule)}
.q:last-child{border-bottom:0}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qn{font-weight:900;font-size:17px;min-width:30px;font-variant-numeric:tabular-nums}
.qstem{font-size:16px;font-weight:500;min-width:0;flex:1}
.qtag{font-family:var(--mono);font-size:11px;color:var(--ink3);margin:2px 0 0 40px;letter-spacing:.03em}
.qtag .wr{color:var(--blue);font-weight:600}
.stemimg{display:block;margin:12px 0 4px 40px;border:1px solid var(--rule);max-width:min(520px,calc(100% - 40px));max-height:360px;object-fit:contain;background:#fafafa}
.opts{list-style:none;margin:12px 0 0;padding:0 0 0 40px;display:flex;flex-direction:column;gap:6px}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid transparent;padding:7px 10px;border-radius:3px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--rule);background:#fafafa}
.opt:disabled{cursor:default}
.bub{flex:none;width:24px;height:24px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--mono);margin-top:-1px}
.opt.right{background:var(--green-bg);border-color:var(--green)}
.opt.right .bub{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red-bg);border-color:var(--red)}
.opt.wrong .bub{background:var(--red);border-color:var(--red);color:#fff}
.opt.wrong .otext{text-decoration:line-through;text-decoration-color:var(--red)}
.opt.dim{opacity:.55}

.fb{margin:14px 0 0 40px;border-left:4px solid var(--ink);padding:12px 16px;background:#fafafa}
.fb.ok{border-color:var(--green)} .fb.no{border-color:var(--red)}
.verdict{font-weight:900;font-size:15px}
.fb.ok .verdict{color:var(--green)} .fb.no .verdict{color:var(--red)}
.concept{color:var(--blue);font-weight:700}
.ex{margin:6px 0 0;font-size:14.5px}
.src{margin-top:10px;font-size:13.5px}
.src .who{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--ink2);text-transform:uppercase}
.src .who b{color:var(--ink)}
blockquote{margin:4px 0 0;padding:8px 12px;border:1px solid var(--rule);background:#fff;font-size:13.5px;color:#222;line-height:1.6;overflow-wrap:anywhere}
blockquote::before{content:"“";font-weight:900;margin-right:2px}
blockquote::after{content:"”";font-weight:900;margin-left:2px}
.slide{margin-top:10px}
.slide summary{font-size:13px;color:var(--ink2);cursor:pointer}
.slide img{display:block;margin-top:6px;border:1px solid var(--rule);max-width:100%}

.sa{margin:12px 0 0 40px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sa input{flex:1 1 260px;min-width:0;border:0;border-bottom:1.5px solid var(--ink);padding:6px 4px;font-size:16px;background:transparent;border-radius:0}
.sa input:focus{outline:none;border-bottom-color:var(--blue)}
.sa input.ok{color:var(--green);border-bottom-color:var(--green)}
.sa input.no{color:var(--red);border-bottom-color:var(--red);text-decoration:line-through}
.sahint{margin-left:40px;font-size:12.5px;color:var(--ink3)}

/* matching */
.match{margin:14px 0 0 40px;position:relative}
.mcols{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1.25fr);align-items:start;position:relative}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.person{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);background:#fff;padding:6px 8px;border-radius:3px;text-align:left;min-height:72px;width:100%}
.person img,.person .ph{flex:none;width:56px;height:56px;object-fit:cover;border:1px solid var(--rule);background:#f1f1f1}
.person .ph{display:grid;place-items:center;font-weight:900;color:var(--ink2);font-size:18px;font-family:var(--mono)}
.person .pn{min-width:0;font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.person .pn small{display:block;font-weight:400;color:var(--ink3);font-size:11px}
.ach{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:#fff;padding:6px 10px;border-radius:3px;text-align:left;min-height:56px;font-size:13.5px;line-height:1.4;width:100%}
.ach .al{flex:none;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:11.5px}
.ach .at{min-width:0;overflow-wrap:anywhere}
.person.sel,.ach.sel{outline:3px solid var(--blue);outline-offset:1px}
.person.linked,.ach.linked{background:var(--blue-bg)}
.person.ok,.ach.ok{background:var(--green-bg);border-color:var(--green)}
.person.no{background:var(--red-bg);border-color:var(--red)}
.mlines{position:absolute;inset:0;pointer-events:none;overflow:visible}
.mfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.pick{display:none}
@media (max-width:640px){
  .match,.opts,.sa,.fb,.qtag,.sahint{margin-left:0;padding-left:0}
  .stemimg{margin-left:0;max-width:100%}
  .mcols{grid-template-columns:minmax(0,1fr) 22px minmax(0,1.15fr)}
  .person{min-height:60px;padding:5px;gap:6px}
  .person img,.person .ph{width:44px;height:44px}
  .person .pn{font-size:12.5px}
  .ach{font-size:12px;padding:5px 6px;min-height:60px}
}
.mres{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.mres li{border-left:4px solid var(--green);padding:6px 10px;background:#fafafa}
.mres li.no{border-left-color:var(--red)}
.mres .mh{font-weight:700}
.mres .mh .yours{color:var(--red);text-decoration:line-through;font-weight:500}

/* essay */
.lined{width:100%;margin:12px 0 0;min-height:190px;resize:vertical;border:1px solid var(--ink);border-radius:0;padding:6px 12px;line-height:30px;font-size:15px;background:#fff repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--rule2) 29px,var(--rule2) 30px);background-attachment:local;background-position:0 6px}
.essay-wrap{margin-left:40px}
@media (max-width:640px){.essay-wrap{margin-left:0}}
.ehint{font-size:12.5px;color:var(--ink3)}
.grade{margin-top:16px;border:1.5px solid var(--ink)}
.grade-h{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--ink);background:#f6f6f6}
.score{font-family:var(--mono);font-weight:600;font-size:22px}
.score.ok{color:var(--green)} .score.no{color:var(--red)}
.meter{flex:1;min-width:120px;height:8px;background:var(--rule2);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.grade-b{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.glabel{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;margin-bottom:4px}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.keys li{display:flex;gap:8px;align-items:flex-start}
.keys .mk{flex:none;width:20px;height:20px;display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff;border-radius:2px;margin-top:2px}
.keys .hit .mk{background:var(--green)} .keys .miss .mk{background:var(--red)}
.keys .miss{color:var(--red)} .keys .hit{color:var(--green)}
.mine,.model{font-size:14.5px;line-height:1.75;padding:10px 12px;border:1px solid var(--rule);background:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
.mine mark{background:var(--green-bg);color:var(--green);border-bottom:2px solid var(--green);padding:0 1px}
.model .k-hit{color:var(--blue);font-weight:700;border-bottom:2px solid var(--green)}
.model .k-miss{color:var(--red);font-weight:700;background:var(--red-bg);border-bottom:2px solid var(--red)}
.legend{font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.legend .l1::before{background:var(--green)} .legend .l2::before{background:var(--red)} .legend .l3::before{background:var(--blue)}

.summary{border:2px solid var(--ink);padding:18px 20px;margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.summary div b{display:block;font-family:var(--mono);font-size:24px}
.summary div span{font-size:12.5px;color:var(--ink2)}
@media (max-width:640px){.summary{grid-template-columns:1fr 1fr}}

.ntools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.chip{border:1px solid var(--ink);background:#fff;padding:3px 10px;border-radius:14px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.note{border:1px solid var(--ink);margin-top:14px}
.note-h{padding:14px 16px 10px;display:flex;gap:12px;align-items:flex-start}
.note-h .nc{flex:1;min-width:0}
.note-h img,.note-h .ph{flex:none;width:64px;height:64px;object-fit:cover;border:1px solid var(--rule);background:#f1f1f1}
.note-h .ph{display:grid;place-items:center;font-weight:900;color:var(--ink2);font-family:var(--mono)}
.ntag{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.04em}
.nconcept{font-size:21px;font-weight:900;color:var(--blue);line-height:1.3;margin:2px 0 0;text-wrap:balance}
.nx{flex:none;width:32px;height:32px;border:1px solid var(--rule);background:#fff;font-size:18px;line-height:1;border-radius:2px}
.nx:hover{border-color:var(--red);color:var(--red)}
.note-b{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.ans-ok{color:var(--green);font-weight:700}
.ans-no{color:var(--red);text-decoration:line-through}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;background:var(--red-bg);border-top:1px solid var(--red);font-size:13.5px;color:var(--red)}
.note details summary{font-size:13px;color:var(--ink2);cursor:pointer}
.empty{border:1px dashed var(--ink3);padding:28px;text-align:center;color:var(--ink2);margin-top:16px}
.misslist{margin:0;padding-left:18px;color:var(--red)}

.lock{border:2px solid var(--ink);padding:16px 18px;margin:18px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lock input{border:1.5px solid var(--ink);padding:8px 12px;min-width:0;flex:1 1 200px;border-radius:0}
.files{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.files li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--rule)}
.files .fn{flex:1;min-width:0}
.files .fn b{display:block;font-weight:700;overflow-wrap:anywhere}
.files .fn span{font-family:var(--mono);font-size:11.5px;color:var(--ink2);overflow-wrap:anywhere;word-break:break-word}
.files .code{font-family:var(--mono);font-weight:600;font-size:13px;width:40px;flex:none}
.msg{font-size:13.5px}
.msg.no{color:var(--red)} .msg.ok{color:var(--green)}
.foot{max-width:900px;margin:18px auto 0;font-size:12px;color:var(--ink3);text-align:center;padding:0 16px}
.cover{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px;font-size:12.5px}
.cover div{border:1px solid var(--rule);padding:6px 8px}
.cover b{font-family:var(--mono)}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand">GCT501<span>EXAM ROOM</span></div>
  <button class="tab" id="tab-quiz" data-go="quiz">퀴즈</button>
  <button class="tab" id="tab-notes" data-go="notes">오답노트<span class="badge" id="nbadge" hidden>0</span></button>
  <button class="tab" id="tab-materials" data-go="materials">강의자료</button>
</div></header>
<main class="wrap" id="app"></main>
<p class="foot">GCT501 Introduction to Culture Technology · 모든 문제는 GCT501 강의자료·Wrap-up·강의노트에서만 출제되며 원문을 그대로 인용합니다.</p>

<script>
/* ======================= DATA ======================= */
const LEC = {
  L01:`01 Culture and Technology`, L02:`02 Philosophy of Technology`, L03:`03 Digital`,
  L05:`05 Pervasive Computing`, L06:`06 Digital Media and Content`, L07:`07 VR / AR`,
  L08:`08 Digital Architecture and Digital Fashion`, L09:`09 Art-Science-Technology Interaction in the Visual Culture`,
  L10:`10 Digital Heritage and Digital Museum`, WR:`Lecture Wrap-up`, NT:`문화기술론 강의노트`
};
const LVN={1:`초급`,2:`중급`,3:`고급`}, LVE={1:`BEGINNER`,2:`INTERMEDIATE`,3:`ADVANCED`};
const MCQ=[],SHORT=[],ESSAY=[],PEOPLE=[];
const _c={};const nid=(p,lv)=>{const k=p+lv;_c[k]=(_c[k]||0)+1;return `${p}${lv}-${String(_c[k]).padStart(3,'0')}`;};
function M(lv,lec,p,c,q,o,ex,qt,x){x=x||{};MCQ.push({id:nid('m',lv),kind:'mcq',lv,lec,p,c,q,o,ex,qt,w:x.w,n:x.n,stem:x.stem});}
function S(lv,lec,p,c,q,acc,ans,ex,qt,x){x=x||{};SHORT.push({id:nid('s',lv),kind:'short',lv,lec,p,c,q,acc,ans,ex,qt,w:x.w,n:x.n,all:x.all,order:x.order,anyOf:x.anyOf,min:x.min});}
function E(lv,lec,p,c,q,model,keys,quotes,x){x=x||{};ESSAY.push({id:nid('e',lv),kind:'essay',lv,lec,p,c,q,model,keys:keys.map(k=>({t:k[0],en:k[1],ko:k[2]})),quotes,w:x.w,n:x.n});}
function P(img,name,lv,lec,p,ach,qt,x){x=x||{};PEOPLE.push({id:'p-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),kind:'pair',img,name,lv,lec,p,ach,qt,w:x.w,n:x.n,work:!!x.work,c:name});}
// ===== Beginner MCQ. M(lv, lec, page, concept, question, [correct, d1, d2, d3], explanation, quote, opts{w,n,img,stem}) =====
M(1,`L01`,12,`Edward B. Tylor — definition of culture`,

M(2,`L02`,8,`Aristotle vs. Heidegger`,

M(2,`L02`,9,`Traditional vs. Modern Technology`,

`Older technology • had to submit to the standards set by nature | Contemporary technology • can set the standards • nature as a supplier of resources • man in an epistemic position with respect to nature | A fundamental gap | the rise of philosophy of technology in the late 19C and in the 20C`,{n:6});

M(3,`L03`,27,`Biased coin information`,
`A biased coin lands front with P = 0.6 and back with P = 0.4. Using I = Σ P·(−log₂P), what is the average information per flip?`,
[`≈ 0.97 bit`,`1 bit`,`≈ 0.74 bit`,`≈ 1.32 bits`],
`Front: −log₂0.6 ≈ 0.7369 bit, Back: −log₂0.4 ≈ 1.3221 bit. 평균 = 0.6×0.7369 + 0.4×1.3221 ≈ 0.97 bit. 공정한 동전(1 bit)보다 예측 가능하므로 정보량이 작다.`,
`Front: P = 0.6 => I = 0.7369bit | Back: P = 0.4 => I = 1.3221bit | I = 0.6 x 0.7369bit + 0.4 x 1.3221bit = 0.97bit`,{n:9});

`I(x) = log ( 1 / P(x) ) = - log P(x) | Unit: bits`,{w:19,n:9});

M(3,`L02`,29,`Embodiment (scenario)`,

M(3,`L02`,53,`Multi-stability (scenario)`,
`A typewriter is a writing tool in an office, a nostalgic décor item in a café, and an art object in a gallery. Which concept, and why?`,
[`Multi-stability — contextuality makes technologies multistable`,`Technological determinism — the typewriter determines culture`,`Instrumentalism — technology is neutral`,`Technium — technology evolves autonomously`],
`Multi-stability: 기술 사용 맥락은 더 큰 문화적 맥락의 일부이며, 맥락성이 기술을 다중안정적으로 만든다(예: typewriter).`,
`In the relation between culture and technology • Technology-use context is part of a larger cultural context • Contextuality makes technologies multistable (eg. typewriter) • The same artefact can have different meanings or identities in different contexts`,{w:18,n:8});

M(3,`L02`,44,`Social Constructivism (scenario)`,

[`Social Constructivism`,`Technological Determinism`,`Instrumentalism`,`Optimistic TD`],

`Social Constructivism • Technology changes due to social circumstances or the influence of social groups. • Conflict and consensus among social groups play an important role • Appears by pointing out the limitations of technology determinism since the 1980s`,{w:15,n:8});

M(3,`L02`,36,`Technological Determinism — tenets`,

`Technology has no [moral] value in itself • Technological development is • autonomous (Humans have no control over technological development) • largely neutral • a positive force that contributes to the development of society • The development of the society is determined and controlled by technological change`,{w:17,n:8});

M(3,`L06`,39,`Variability (scenario)`,

M(3,`L06`,40,`Transcoding (scenario)`,

M(3,`L05`,38,`Dimension of Context Awareness (scenario)`,
`A phone notices a large display nearby and shifts a video from the small mobile screen to the large display. Which dimension of context awareness is this?`,

`Contextual sensing: sense the environment • Contextual resource recovery: locate and exploit resources and services (a display, printers ..) • Contextual adaptation: modify a service (large display ↔ mobile display) • Contextual augmentation: collect and associate digital information • Contextual commands: presentation of commands`,{});

E(1,`L01`,`12–15`,`Tylor and Boas`,
`Explain how the concept of culture changed from "before Tylor" to Tylor (1871) and then to Franz Boas.`,
`Before Tylor (antiquity – early 1800s), human difference was explained by Climate Determinism (customs explained as climate acting directly on the body), Theological Explanation (divine will or fate), and Biological/Racial Essentialism (custom and morality as fixed, inherited traits) — always by body or god, never by learning. Edward Tylor's Primitive Culture (1871) was a revolution: culture is "that complex whole … acquired by man as a member of society," framing custom as acquired, not innate — the first modern definition of culture in anthropology. Its limit was that it was still a hierarchy: all societies pass through the same stages, and cultural diversity meant differing stages of development. Franz Boas, founder of American anthropology, separated race from culture through (1) empirical refutation — immigrant skull studies showed physical traits shift within a generation because of the environment, not genetics; (2) historical particularism — each culture follows its own path; and (3) seeds of relativism — difference is not hierarchy but different learned solutions.`,
[[`Before Tylor: climate / theological / biological explanations`,[`climate`,`theolog`,`biolog`,`racial`,`divine`],[`기후`,`신학`,`생물`,`인종`]],

E(1,`L02`,`34–48`,`Technological Determinism vs. Social Constructivism`,
`Compare technological determinism and social constructivism, with at least one example of each.`,
`Technological determinism sees technology as the primary reason for the growth and progress of a society: technological development is autonomous (humans have no control), largely neutral, and a positive force; the development of society is determined and controlled by technological change. Examples: the invention of the stirrup (8th century) → feudal societies; shipbuilding technology → the discovery of the Americas by Columbus (15th century); the automobile → suburban US. It has optimistic (Toffler, Naisbitt) and pessimistic (Heidegger, Mumford, Ellul, Marcuse) versions. Social constructivism, the exact opposite, says technology develops as a result of social, cultural, or economic factors; it changes due to social circumstances or the influence of social groups, and conflict and consensus among social groups play an important role. It appeared in the 1980s by pointing out the limitations of technological determinism (e.g., the bicycle's shape changing with women users). Thomas Hughes' technology system goes beyond both: initially social factors affect, and after the system solidifies it has momentum.`,
[[`TD: technology is the primary reason for social progress`,[`primary reason`,`determin`],[`결정론`,`주된 원인`]],

E(1,`L03`,`19–29`,`Shannon's Information`,
`Explain how Shannon's information theory measures the quantity of information, using the coin-flip example.`,
`Claude Shannon, the father of the digital age, founded information theory, a branch of communications theory concerned with how best to encode a message a sender wants to transmit. Instead of word count, information is measured by predictability — a message's surprise value. Information is inversely proportional to its probability of occurrence and a continuous function of it: I(x) = log(1/P(x)) = −log P(x), in bits. For a normal coin, front and back each have P = 0.5, so each carries 1 bit and the average is 0.5×1 + 0.5×1 = 1 bit. For a biased coin (0.6/0.4), front carries 0.7369 bit and back 1.3221 bit, and the average is 0.97 bit — less, because the outcome is more predictable. A system generating messages S1…Sn with probabilities P1…Pn carries I = P1×I1 + … + Pn×In.`,
[[`Shannon / information theory, encoding messages`,[`shannon`,`information theory`,`encode`],[`섀넌`,`샤논`,`정보 이론`,`정보이론`]],
 [`Predictability / surprise value, not word count`,[`predictab`,`surprise`,`word count`],[`예측`,`놀람`]],
 [`Inversely proportional to probability`,[`inversely`,`probability`],[`반비례`,`확률`]],
 [`Formula I(x) = −log P(x), bits`,[`-log`,`−log`,`log(1/`,`log (1`,`bit`],[`비트`,`로그`]],
 [`Normal coin = 1 bit`,[`1 bit`,`1bit`,`0.5`],[`1비트`]],
 [`Biased coin ≈ 0.97 bit`,[`0.97`,`biased`],[`편향`]],
 [`System information = Σ P×I`,[`p1`,`weighted`,`sum`,`σ`],[`가중`,`합`]]],

E(1,`L06`,`11–18`,`McLuhan`,
`Explain McLuhan's "The Medium is the Message" and "Extensions of Man," including his Four Ages of History.`,
`For Marshall McLuhan, a medium itself, not the content it carries, should be the focus: it is the medium that shaped and controlled the scale and form of human association and action, so the change of the medium changes the entire cultural model — the medium is the actual "content" of the culture. This makes him a technological determinist and formalist. In Understanding Media: The Extensions of Man (1964), "all media are extensions of some human faculty — psychic or physical": the wheel extends the foot, the book the eye, clothing the skin, and electric circuitry the central nervous system. Through the sense ratio, the dominant media of any age determine the ratio of the senses, and their interiorization transforms mental processes. The Four Ages: Tribal Age (spoken word, oral culture, hearing/touch/taste/smell — phonocentric); Age of Literacy (phonetic alphabet, hand-writing) and Print Age (Gutenberg galaxy, repeatability) with predominance of sight — ocularcentric; and the Electronic Age (global village, multi-media) — a balance of the senses.`,

E(1,`L07`,`68–73`,`Immersion and Presence`,
`Define mental immersion, physical/sensory immersion, and presence, and explain how immersion relates to presence.`,
`Mental immersion is a state of being deeply engaged, involving suspension of disbelief and involvement. Physical/sensory immersion is bodily entering into a medium — synthetic stimulus of the body's senses via technology, such as perspectives, synchronized audio, and haptic information. Presence is the sense of "being there"; Sheridan (1992) defines virtual presence as a sense of being physically present with visual, auditory, or force displays generated by a computer, and telepresence is presence in a remote environment via a communication medium. Presence is enhanced by high-quality graphics, binaural/3D sound, good interaction, responsiveness, and absence of lags. According to Slater & Wilbur (1997), immersion is the extent to which technology delivers a vivid illusion of reality to the senses, while presence is a state of consciousness — the psychological sense of being in the virtual environment. Immersion produces a sense of presence, and the goal of VR is to create a high degree of presence.`,

E(1,`L08`,`3–16`,`Architecture and Fashion`,
`Discuss the similarities between architecture and fashion, using Vitruvius' virtues and the idea of place-making.`,
`Coco Chanel said "Fashion is architecture. It is a matter of proportion," and the Skin+Bones exhibition showed their similarities. In function, both provide shelter to cover the human body from interference (houses static, garments dynamic), express identity according to religion, culture, tradition and social values, and serve as communication media. In forms and styles, both create structures and spaces for the body, use geometry that evolved from simple to complex forms with technology, and share innovation with color and texture in appearance. Both interact with art, science and technology. Vitruvius' De architectura gives the essential components of architectural values: Utilitas (function, commodity, utility), Firmitas (solidity, materiality), and Venustas (beauty, delight, desire). Architecture is the designing of space to fulfill the user's needs defined by culture (e.g., the Greek agora for debate, the Pantheon dome). Place-making turns space into place, giving users a sense of place, territory and orientation.`,

E(1,`L10`,`21–26`,`Digital Heritage at Risk`,
`What is digital heritage, and why is it "at risk"? Explain with the lifespan of media and the Digital Dark Age.`,
`According to UNESCO's Charter on the Preservation of Digital Heritage (2003), digital heritage consists of unique resources of human knowledge and expression, embracing information created digitally ("born-digital," where there is no other format but the digital object — texts, databases, images, audio, graphics, software, web pages) or converted into digital form from existing analogue resources ("digitized"). Digital heritage is at risk because of technical difficulties of long-term preservation. The relative lifespan of media shows stone (monument) 1000x, paper/wood 100x, magnetic/optical (CD, disk, tape) 10x, and coding (VRML, JPEG data format) only 1x — digital formats have the shortest lifespan. Like the Dark Age (600AD–1600AD), a Digital Dark Age may come: if we do not have a way to serve the data, the data may become useless. Therefore digital preservation must be part of digital heritage along with documentation, reconstruction and dissemination.`,

E(1,`L09`,`9–12`,`Visual Culture`,
`What is visual culture? Explain how technological innovation led from oral and print culture to visual culture.`,
`Visual culture is the visualization, through various means, of the values and beliefs of a culture (Barnard, 1998); a form of life based on the visible, with predominance of visual forms of communication and information (Barroso, 2020); human culture based on visual media, as opposed to oral and print culture based on language and writing. Mitchell (2002): "visual culture is the visual construction of the social, not just the social construction of vision." Mirzoeff (1999) describes visual events in which information, meaning or pleasure is sought in an interface with visual technology. Visual culture studies recognize the predominance of visual media in the postmodern world. Historically, oral culture was followed by print culture based primarily on words and printing; technological innovations — painting, photography, motion picture, television, computer graphics, the internet and VR — led to a visual culture based on images, each a new way of representing reality.`,

E(2,`L02`,`14–33`,`Technology as Extension and Mediation`,
`Compare Ernst Kapp's organ projection, McLuhan's extensions of man, and Don Ihde's human-technology relations.`,
`Kapp, McLuhan and Rothenberg see technical objects as extending the human organism by replicating or amplifying bodily and mental abilities. Ernst Kapp (1877), who introduced the term "philosophy of technology," argued that humans unconsciously project organs to the outside — transferring the form, function and proportions of their body to the works of their hands (hammer = fist) — and that self-consciousness results from knowledge of an exterior turning into knowledge of an interior: humans discover their humanness in culture, the totality of technical objects. McLuhan (1964) extended this to media: all media extend some human faculty, and electric media extend the central nervous system, approaching "the technological simulation of consciousness" as a collective consciousness. Don Ihde instead analyses how technology mediates human–world relations in four ways: embodiment ((human–technology) → world, e.g., Neil Harbisson), hermeneutic (human → (technology–world), e.g., electron microscope), alterity (human → technology (world), central to interaction design), and background (technology as context, not experienced itself).`,

E(2,`L03`,`37–50`,`Turing, Searle, and machine intelligence`,
`Explain the Turing Machine, the Turing Test, and the Chinese Room Argument, and discuss what ARC-AGI suggests about testing AI today.`,
`Alan Turing, founder of computer science, proposed a reference model of computers that is simple, powerful, and abstract enough: the Turing Machine, with an infinite tape and a head that at each step reads a symbol, writes a symbol, and moves left or right. His thesis states that any mathematical problem solvable by a mechanical procedure (algorithm) can be modeled by a Turing machine; since one machine handles one problem and the number of machines is infinite, the Universal Turing Machine was proposed. The Turing Test ("The Imitation Game") considers a machine intelligent if its answers cannot be distinguished from a human's; spin-offs include the Marcus test, Lovelace test 2.0, and reverse Turing test. John Searle's Chinese Room Argument (1980) counters "Strong AI": a person using an English rulebook can produce correct Chinese responses without understanding Chinese, so symbol manipulation is not understanding. With LLMs said to break the Turing test, new measures are needed: ARC-AGI-3 evaluates fluid adaptive efficiency on novel tasks without language or external knowledge — humans solve 100%, frontier AI scored below 1% as of March 2026.`,

E(2,`L05`,`2–48`,`Pervasive and Context-aware Computing`,
`Explain ubiquitous/pervasive computing (Mark Weiser, eras, principles) and context-aware computing (Dey's definition, 5W, benefits).`,
`Ubiquitous computing (Latin ubique, "everywhere") makes computing appear anytime and everywhere. Mark Weiser at Xerox PARC coined the term and proposed calm technology: "The most profound technologies are those that disappear." Computing moved from the Mainframe Era (one computer shared by many, N:1) through the PC Era (1:1) to the Pervasive Computing Era (1:N, N:M), and next an agent-orchestrated era where AI agents select devices. Principles: decentralization, diversification (task-specific devices), connectivity (always-on, wireless), and simplicity (seamless, intuitive, "calm"). Context, per Dey, is any information that characterizes the situation of an entity, and a system is context-aware if it uses context to provide relevant information/services where relevancy depends on the user's task. Context-aware computing analyzes Who/What/Where/When, understands Why (user intent, harder than what), and executes How. Benefits are adaptation, personalization, and proactivity; key issues are relevance, accuracy, and security/privacy. In the age of AI it shifts from structured variables to implicit meaning.`,

E(2,`L06`,`31–40`,`Manovich's Principles of New Media`,
`Define new media and explain Manovich's five principles with an example for each.`,
`New media are forms of media that are computational and rely on computers for redistribution, enabling interaction between users and between users and content (widely used from the mid-1990s, e.g., CD-ROM). Lev Manovich, in The Language of New Media (2001), sees new media as the convergence of computing technology (Babbage's Analytical Engine) and media technology (Daguerre's Daguerreotype). Five principles: (1) Numerical representation — new media objects are made of numeric codes, described mathematically, subject to algorithmic manipulation, discrete (like the Industrial Revolution's standardization). (2) Modularity — elements such as pixels, polygons, voxels are independent but form a greater object and can be replaced without affecting the whole (objects in an HTML page). (3) Automation — low-level by the user, high-level by the computer, plus efficient media access. (4) Variability — not fixed once and for all but existing in potentially infinite versions (hypertext, interactive media). (5) Transcoding — translation between formats; the computer layer and cultural layer affect each other, reshaping culture by the logic of the computer.`,

E(2,`L07`,`24–43`,`History of VR`,
`Describe the four stages of VR with the key people and inventions of each stage.`,
`1st Stage (1950s–1980s) — Visionaries: Morton Heilig, "father of VR," created the Sensorama (developed 1957, patented 1962; a multi-sensory, non-interactive motorcycle ride through Brooklyn), the Telesphere Mask (1960) and the Experience Theatre; Ivan Sutherland proposed "The Ultimate Display" (1965) — "think of it as a window into a virtual world"; Myron Krueger created Artificial Reality (Metaplay 1970, Videoplace 1975); William Gibson imagined cyberspace (Neuromancer 1984). 2nd Stage — technology development for specific purposes: HMDs (Headsight 1961 by Philco engineers; Sword of Damocles 1968 by Sutherland), training simulators (first flight simulator 1929 by Edwin Link), tele-operation, space exploration, and AR in industry (Boeing; "augmented reality" coined by Tom Caudell). 3rd Stage (1990s–2000) — VR as general purpose technology: Artaud's "la réalité virtuelle" (1938), the term popularized by Jaron Lanier, VR culture and game industry, then decline as "solutions without problems." 4th Stage (2010–) — popularization and toward an academic discipline: VR for everyone, global companies, VR as science (computational reality, presence), engineering, HCI, media, and a social/cultural phenomenon.`,

E(2,`L08`,`19–38`,`From analogue computation to digital architecture`,
`Trace the development from Gaudi's analogue computation through cybernetics and proto-parametricism to BIM and generative design.`,
`Antoni Gaudi used analogue computation with physical models to compute parts of buildings and understand structural and spatial relationships; it influenced designers in the late 20th and early 21st centuries, was further developed by Frei Otto, and evolved into computational tools that incorporate physics engines. In the mid-20th century cybernetics — "control and communication in the animal and the machine," defined by Norbert Wiener (1948) — inspired architects; Nicholas Negroponte's The Architecture Machine (1972) imagined a human–machine dialogue where the machine learns from the human (SEEK project). John Frazer saw cybernetics enabling artefacts evolving with natural forces, with generative and evolutionary algorithms as a design model. From Sullivan's "form follows function" (1896): if function can be described by parameters, form can be designed by equations — Luigi Moretti's "architettura parametrica." Digital tools spread in the late 1980s–early 1990s (Frank Gehry). BIM is a digital representation of physical and functional characteristics of a facility, a shared knowledge resource across its life cycle, where changes in one drawing affect all others. Generative design uses algorithms to explore all design possibilities based on goals and constraints, based on parametric design.`,

E(2,`L09`,`17–62`,`Perspective and optical devices`,
`Explain how the representation of 3D reality on a 2D plane developed from the Renaissance (perspective, optical devices) and how it connects to computer graphics.`,
`Before perspective, works like Duccio's The Calling of the Apostles were flat; Giotto added depth. Masaccio's Holy Trinity (c. 1427) used orthogonal lines, and Brunelleschi's experiment (1425) demonstrated linear perspective; Alberti codified it in Della pittura (1435), and Dürer illustrated a perspective machine in The Painter's Manual (1525). Leonardo da Vinci defined perspective as "the vision of a scene behind a flat and clear glass" with pyramids connecting objects to the eye. Mantegna's Dead Christ shows foreshortening. Optical devices — the pinhole camera, camera obscura ("dark room"), and camera lucida ("well-lit room") — helped painters; the Hockney-Falco thesis (2001) argues that advances in realism were primarily the result of optical aids (e.g., Vermeer). For 400 years after the Renaissance, painting aimed to represent reality. In computer graphics, da Vinci's model maps directly: the virtual camera is the eye, the glass is the image plane, the pyramids are rays in the view frustum, and ray tracing computes "what color is this pixel?"`,

E(2,`L10`,`28–63`,`Digital Applications in Heritage`,
`Explain digital documentation, digital reconstruction, virtual restoration, and digital restoration in cultural heritage, with examples.`,
`Digital heritage sub-domains are documentation and digitisation, analysis and presentation, representation and dissemination, and archive and preservation. Digital documentation is the use of digital tools and technologies to measure and record cultural and natural heritage — digital-based metric survey technologies give precise and large data, new analysis, re-use, and network accessibility; sensors include visual, dimensional (laser scanning, total station), locational (GPS) and environmental ones; 3D scanning supports multi-resolution models and tomodensitometry (CT) analysis. Digital reconstruction virtually reconstructs and visualizes damaged or lost sites (The Parthenon 2004 by USC ICT, Rome Reborn 1997/2007), enabling unlimited viewpoints, risk-free interaction, virtual tourism and education; virtual archaeology was introduced by Paul Reilly (1990). Virtual restoration simulates physical restoration in a virtual space — reconstructing an object at a time in the past, or evaluating hypotheses (e.g., edge matching of fragments, flattening deformed documents). Digital restoration is actual restoration in the digital domain, such as in-painting of photos, film and manuscripts, useful when the digital result can substitute the original. Restoration can also use digital fabrication (Madonna of Pietranico; Head of Queen Tiy).`,

E(2,`NT`,`12–14`,`Data Visualization and Perception`,
`Why do we visualize data? Explain using Anscombe's Quartet, perception vs. cognition, Gestalt principles, and pre-attentive processing.`,
`Visualization is the graphical representation of information and data, "used to extend the cognition" (Stuart Card, 1990) and suitable when there is a need to augment human capabilities (Tamara Munzner, 2012). We visualize to record, analyze (support reasoning, discover errors, find patterns), and communicate — for sense-making and communication (Stephen Few). Anscombe's Quartet (1973) shows four datasets with the same linear regression (y = 3 + 0.5x) that look completely different when plotted. Perception (receiving signals, instant) is faster than cognition (interpreting, time-taking); visualization replaces cognition with perception, reduces load on working memory, and exploits the bandwidth of vision (70% of sensory receptors). The Pictorial Superiority Effect means pictures are recognized better than words. Gestalt principles describe how people group visual elements into unified wholes — simplicity, similarity, proximity, enclosure/closure, continuity, connection, figure & ground. Pre-attentive processing registers basic features (color, shape, size, orientation, motion) automatically and in parallel; contrast enables pop-out.`,

E(3,`L02`,`4–17`,`AI through the philosophy of technology`,
`Using instrumentalism, Heidegger's view, and optimistic vs. pessimistic technological determinism, analyze generative AI. Which views apply, and what does Hughes' technology system or multi-stability add?`,
`Instrumentalism treats technologies as neutral tools whose outcomes depend on human use, assuming progress is unquestionably positive and focusing on efficiency — which explains the late appearance of philosophy of technology. Applied to AI, it would say AI is just a tool and harms come from misuse. Heidegger instead sees technology as a way of knowing, uncovering the hidden nature of things; contemporary technology sets standards and treats nature as a supplier of resources (standing-reserve), so AI could be seen as treating human expression and data as resources. Optimistic technological determinism (Toffler, Naisbitt) would argue AI's direction is the direction of social progress and will enrich human life, while pessimistic TD (Heidegger, Mumford, Ellul, Marcuse) warns of the illusion of abundance, humans becoming slaves of technology, and dehumanization — the lecture explicitly asks "AI?" for both sides. Social constructivism adds that AI is shaped by social groups' conflicts and consensus. Hughes' technology system says AI works only as part of a larger system (data, chips, platforms) and gains momentum once solidified; multi-stability reminds us the same AI can have different meanings in different contexts. A strong answer weighs these rather than picking one.`,

E(3,`L01`,`62–74`,`Can AI be an artist?`,
`"Can AI 'create' art? Can AI be an artist?" Argue your position using AARON, the Portrait of Edmond de Belamy, the comparison with photography, Duchamp, and the "technology as a collaborator" view.`,
`AARON, Harold Cohen's painting software (from 1973), was an early AI program that generated original art. In 2018 the Portrait of Edmond de Belamy, a portrait of a fictional character created by the Paris-based trio Obvious after feeding 15,000 portraits from the 14th–15th centuries into an algorithm (a GAN), was sold at Christie's for US$432,500. Obvious compared AI to photography in the 1800s — "a new branch of art" — echoing Delaroche's "from today painting is dead" and Rejlander's composite photograph (1857), which were once doubted as art. Duchamp's Fountain (1917) shifted art toward concept rather than manual making, so the lecture notes ask whether art is a concept rather than a subject (Conceptual Art → AI Art). Style transfer reproduces style, raising the question of originality. In the art perspective, technology can be a subject matter, raw material, tool, medium, and collaborator — AARON is the example of technology as a collaborator — and the last slide asks "Technology as an artist?" (e.g., an AI-generated artwork winning a Colorado State Fair prize, 2022). A good answer takes a position (e.g., AI as collaborator vs. autonomous artist) and justifies it with these cases.`,

E(3,`L07`,`3–8, 47–77`,`Designing a VR/AR experience`,
`Design a VR or AR heritage/museum experience and justify it with: VR vs. AR (realism in perception, Milgram's continuum), the type of VR system, Sherman & Craig's four elements, immersion vs. presence, and Zeltzer's AIP cube.`,

E(3,`L05`,`26–48`,`Pervasive computing scenario (group discussion)`,
`"How might pervasive computing reshape everyday practices, social interactions, and shared norms in a museum (or home)?" Propose a context-aware service and analyze it with the design process, benefits, key issues, and the AI-era shift.`,
`Propose a concrete service (e.g., a museum guide that adapts to visitors, or an emotion-aware smart home). Specification: define its context-behaviors. Context acquisition: sensors capture who (age, group), where (location), when, and what (activity) from the environment; context delivery turns sensor data into context information; context analysis interprets meaning and intent (why) — the hardest part; action executes how. Context types include computing, user, and physical environments. Benefits: adaptation, personalization (different visitors perceive it differently), and proactivity (pushing information without request). Key issues: relevance, accuracy (sensing, AI), and security/privacy, since understanding intent needs much information about users and people nearby; the lecture notes also list cost, insufficient bio data, and inaccuracy for emotion analysis. Following Weiser's calm technology, it should stay in the periphery and "disappear." In the AI era, context-awareness shifts from structured variables and rule-based processing to unstructured signals and semantic, probabilistic inference — contextual AI that analyzes cultural and situational aspects — and an agent may orchestrate devices. Finally predict cultural change: new norms of attention, sharing, and privacy.`,

E(3,`L09`,`63–102`,`Art–Science–Technology interaction in modern art`,
`Explain how science and technology changed painting from Impressionism to Cubism and Surrealism, and how this reflects the Modernism shift.`,
`For 400 years after the Renaissance, painting aimed to represent reality. Photography (Daguerreotype, 1839) challenged this — Delaroche declared "from today painting is dead" — so painters turned from representation to interpretation. The metal paint tube let Impressionists paint outdoors and capture the interaction of light and object (Monet's Impression, Sunrise, Rouen Cathedral series). Optics and spectroscopy (Kirchhoff and Bunsen) and Chevreul's color theory (harmony and contrast, primary and complementary colors; Charles Henry) shaped Degas' vivid complementary contrasts and Seurat's pointillism. Cézanne painted from multiple viewpoints and saw painting as geometric structure of primitive shapes, becoming the father of modern art and leading to Cubism (Picasso, Braque), which influenced sculpture and architecture. Ideas of the 4th dimension (Poincaré, Einstein) appeared in art, as in Dalí's hypercube Crucifixion; Muybridge's motion photography influenced Duchamp's Nude Descending a Staircase. Modern physics (Rutherford, Bohr, Schrödinger, Heisenberg) moved science from absolute certainty to relative uncertainty. Modernism thus shifted art from representation to interpretation, science from absolute to relative, technology from machinery/force to electricity/energy, and society from rational simplicity to irrational complexity.`,

E(3,`L09`,`103–129`,`From light to neural rendering`,
`Compare ray tracing, the plenoptic function/light field, NeRF, and Gaussian Splatting as ways to generate 2D images of 3D reality.`,
`The core question is how three-dimensional reality can be represented on a two-dimensional plane, linking reality and digital via sensors/modeling, computer graphics (3D scene → 2D image), and computer vision (2D image → 3D shape, material, motion). (1) Simulation: ray tracing asks "what color is this pixel?" by building a model, scene, and light direction and simulating light through the view frustum between near and far clip planes. (2) Light as a function: the plenoptic function ("the set of things one can ever see," Adelson and Bergen, early 1990s) describes light intensity as a 7-D function of viewpoint (position and direction), time, and wavelength, simplified to a 5D plenoptic function and 4D light field (Levoy, Gortler), captured by light-field cameras. (3) NeRF learns a continuous volumetric scene function from a sparse set of input views: 5D input (position + direction) → color + density, enabling novel view synthesis (NeRF in the Wild). (4) Gaussian Splatting defines 3D space as a set of Gaussians whose position, covariance, color and alpha are learned by machine learning, rendering fast and handling reflective materials. Neural rendering more broadly uses deep networks for inverse rendering and novel view synthesis.`,

E(3,`L10`,`75–99`,`Digital museum and technology`,
`How has the role of technology in museums changed from computerization to virtual museums? Discuss the information-centered museum, LAM convergence, technology-mediated learning, and the museum without walls.`,
`The traditional museum (Mouseion → cabinets of curiosities → public museums like the National Gallery, Prado, Altes Museum) was a collections-focused, building-based institution and a "cultural authority" serving a narrow social group; the first museum revolution came at the end of the 19th century and the second in the 1960s–70s (Van Mensch). Lytle's "The Smithsonian is Information" (1981) recognized the museum as information-centered: museums select objects because they convey information. Computerization began in the 1960s (misconception that only large collections justify computers), minicomputers in the 1970s, and ICT, email and networks in the 1990s–2000s with public expectations for access and convergence of museum, library and archive interests (LAM, which often shared space and personnel in the late 1800s–early 1900s). Museums became constructivist, free-choice learning places; technology mediates between information and visitors' knowledge — for the representation of information and for the interpretive, personal experience of visitors (technology-mediated learning). VR, AR, AI and projection mapping create new experiences. Malraux's Museum without Walls (1947) — "an art book is a museum without walls" — anticipates virtual museums, defined as online museums that complement physical museums or are museums in their own right (VoMA, Mona Lisa Beyond the Glass). The notes add that young visitors now value analytic content more than technology itself.`,

E(3,`L03`,`58–74`,`Culture emerges from digital technology`,
`"Culture emerges from technologies." Explain the shift from oral to print to digital culture and analyze today's AI culture using Negroponte's Being Digital and the five fundamental characteristics of digital technology.`,
`Culture is characterized by tools (Paleolithic, Neolithic, Bronze, Iron ages) and by technological artifacts (automobile, computer, smartphone, robot cultures); the dominant technologies of a society shape its culture. Gutenberg's movable type (1439) moved communication from the oral field of speech to the visual field of writing, giving birth to print culture — expansion of literacy, dissemination of knowledge, intellectual and religious debates (Reformation, Enlightenment). Broadcast culture (radio/TV) created simultaneous mass communication and centralized production. The internet led to digital culture, requiring new modes of communication. Negroponte's Being Digital (Atom vs. Bits; atoms → bits shift and fusion) predicted personalization (rise of "me"), vanishing geographical limits, change of mass media (narrowcasting, non-realtime viewing, P2P), e-communities, and a post-digital age of connected, personalized things. The five characteristics — uniformity (binary representation, transmission, processing, storage), subjectivity (interpretation), universality (simulation of everything), duality (real vs. virtual), and non-linearity (recombination, reconfiguration) — drive social phenomena (D-power). AI culture, with mass content production, shows decentralized knowledge, individualization and bipolarization (notes), extending personalization and non-linearity.`,

function pickStrat(pool,n){const by={};shuffle(pool).forEach(x=>(by[x.lec]=by[x.lec]||[]).push(x));const ks=shuffle(Object.keys(by));const out=[];while(out.length<n&&ks.some(k=>by[k].length)){for(const k of ks){if(out.length>=n)break;if(by[k].length)out.push(by[k].shift());}}return out;}
function drawFrom(all,n,seen){
  let a=pickStrat(all.filter(x=>!seen.has(x.id)),n), reset=false;
  if(a.length<n){reset=true;const have=new Set(a.map(x=>x.id));a=a.concat(pickStrat(all.filter(x=>!have.has(x.id)),n-a.length));}
  return {a,reset};
}
function peoplePool(lv){return PEOPLE.filter(p=>lv===1?p.lv===1:lv===2?p.lv<=2:true).filter(inScope);}
function buildMatch(pool,seen,k=5){
  const {a}=drawFrom(pool,k,seen);
  const used=new Set(a.map(x=>x.id));
  const extra=shuffle(PEOPLE.filter(x=>!used.has(x.id)))[0];
  const right=shuffle([...a.map(x=>x.id),extra.id]);
  return {id:'match-'+Math.random().toString(36).slice(2,8),ids:a.map(x=>x.id),right,distractor:extra.id};
}

const norm=s=>String(s).toLowerCase().normalize('NFKC').replace(/[’'`´]/g,"'").replace(/[−–—]/g,'-').replace(/\s+/g,' ').trim();
function hasTerm(text,term){
  const t=norm(term), x=norm(text); if(!t) return -1;
  if(/^[\x00-\x7F]+$/.test(t)&&t.length<=3){const re=new RegExp(`(^|[^a-z0-9])${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(?![a-z0-9])`);const m=re.exec(x);return m?m.index+m[1].length:-1;}
  return x.indexOf(t);
}
function gradeShort(q,text){
  const x=norm(text); if(!x) return false;
  if(q.all) return q.all.every(g=>g.some(t=>hasTerm(x,t)>=0));
  if(q.order){const pos=q.order.map(g=>Math.min(...g.map(t=>{const i=hasTerm(x,t);return i<0?Infinity:i;})));return pos.every(p=>p<Infinity)&&pos.every((p,i)=>i===0||p>pos[i-1]);}
  if(q.anyOf){return q.anyOf.filter(g=>g.some(t=>hasTerm(x,t)>=0)).length>=(q.min||1);}
  return q.acc.some(a=>hasTerm(x,a)>=0||norm(a).replace(/\s/g,'')===x.replace(/\s/g,''));
}
function findAll(text,term){
  const t=term.trim(); if(!t) return [];
  const e=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); const ascii=/^[\x00-\x7F]+$/.test(t);
  const re=ascii&&t.length<=3?new RegExp(`(^|[^a-z0-9])(${e})(?![a-z0-9])`,'gi'):new RegExp(`()(${e})`,'gi');
  const out=[];let m;while((m=re.exec(text))){const s=m.index+m[1].length;let en=s+m[2].length;if(ascii&&/[a-z]$/i.test(m[2]))while(en<text.length&&/[a-z]/i.test(text[en]))en++;out.push([s,en]);if(m[0].length===0)re.lastIndex++;}
  return out;
}
function gradeEssay(q,text){const res=q.keys.map(k=>{const terms=[...k.en,...k.ko];let sp=[];terms.forEach(t=>sp=sp.concat(findAll(text,t)));return {t:k.t,hit:sp.length>0,spans:sp,terms};});return {res,score:Math.round(res.filter(r=>r.hit).length/q.keys.length*100)};}
function markSpans(text,spans){spans=spans.slice().sort((a,b)=>a[0]-b[0]);const mg=[];for(const s of spans){const l=mg[mg.length-1];if(l&&s[0]<=l[1])l[1]=Math.max(l[1],s[1]);else mg.push(s.slice());}let o='',i=0;for(const[a,b]of mg){o+=esc(text.slice(i,a))+`<mark>${esc(text.slice(a,b))}</mark>`;i=b;}return o+esc(text.slice(i));}
function modelHTML(q,res){const text=q.model,sp=[];res.forEach(r=>{let best=null;r.terms.forEach(t=>{const f=findAll(text,t)[0];if(f&&(!best||f[0]<best[0]))best=f;});if(best)sp.push([best[0],best[1],r.hit?'k-hit':'k-miss']);});sp.sort((a,b)=>a[0]-b[0]);let o='',i=0;for(const[a,b,c]of sp){if(a<i)continue;o+=esc(text.slice(i,a))+`<span class="${c}">${esc(text.slice(a,b))}</span>`;i=b;}return o+esc(text.slice(i));}

function setStats(set){

  $('#exportB').onclick=()=>{const blob=new Blob([JSON.stringify({app:'gct501',v:2,at:new Date().toISOString(),state:ST})],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`gct501-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);$('#bmsg').className='msg ok';$('#bmsg').textContent='백업 파일을 저장했습니다. 다른 기기에서 [백업 불러오기]로 합칠 수 있습니다.';};
  $('#importF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='gct501'||!d.state)throw 0;const st=d.state;ST.wrong=Object.assign({},st.wrong||{},ST.wrong);[1,2,3].forEach(l=>ST.seen[l]=[...new Set([...(ST.seen[l]||[]),...((st.seen||{})[l]||[])])]);ST.sets=Math.max(ST.sets||0,st.sets||0);if((st.history||[]).length>(ST.history||[]).length)ST.history=st.history;save();renderNotes();$('#bmsg').className='msg ok';$('#bmsg').textContent='백업을 합쳤습니다.';}catch(err){$('#bmsg').className='msg no';$('#bmsg').textContent='GCT501 백업 파일이 아닙니다. 이 페이지에서 저장한 .json 파일을 고르세요.';}};
  const cb=$('#clearNotes');if(cb)cb.onclick=()=>{const c=$('#clearC');c.innerHTML=`<div class="confirm" style="margin-top:8px"><span>오답노트 ${all.length}개를 모두 지울까요? 되돌릴 수 없습니다.</span><button class="btn sm danger" data-y>모두 지우기</button><button class="btn sm ghost" data-n>취소</button></div>`;c.querySelector('[data-n]').onclick=()=>c.innerHTML='';c.querySelector('[data-y]').onclick=()=>{ST.wrong={};retrySet=null;noteFilter='all';save();renderNotes();};};
  const nl=sec.querySelector('#nlist');
  if(!all.length){nl.innerHTML=`<div class="empty"><b>오답노트가 비어 있습니다.</b><br>틀린 객관식·단답형, 잘못 연결한 인물, 60점 미만 서술형이 여기에 모입니다.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="gq">퀴즈 풀러 가기</button></div></div>`;$('#gq').onclick=()=>go('quiz');return;}
  list.forEach(w=>nl.appendChild(noteEl(w)));
  if(retrySet){app.appendChild(paperFor(retrySet,`오답 다시 풀기`,`GCT501 · Retry Wrong Answers`));return;}
  const rs=document.createElement('section');rs.className='sheet';
  rs.innerHTML=`<div class="part" style="margin-top:0"><h2>오답 퀴즈</h2><span>오답노트 문항만 다시 출제</span></div>
    <p class="lede">현재 필터의 ${list.length}개를 순서와 보기를 섞어 다시 풉니다. 인물은 5명씩 묶어 매칭 문제로 나옵니다. 맞히면 그 자리에서 오답노트에서 지울 수 있습니다.</p>
    <div class="row"><button class="btn" id="retry" ${list.length?'':'disabled'}>오답 퀴즈 시작 (${list.length}개)</button></div>`;
  app.appendChild(rs);
  $('#retry').onclick=()=>{
    const ids=shuffle(list.map(w=>w.id));const pairs=ids.filter(i=>BYID[i].kind==='pair');const match=[];
    for(let i=0;i<pairs.length;i+=5){const g=pairs.slice(i,i+5);if(g.length<2){const more=shuffle(PEOPLE.filter(p=>!g.includes(p.id))).slice(0,2-g.length).map(p=>p.id);g.push(...more);}const used=new Set(g);const extra=shuffle(PEOPLE.filter(p=>!used.has(p.id)))[0].id;match.push({id:'match-r'+i,ids:g,right:shuffle([...g,extra]),distractor:extra});}
    retrySet={mode:'retry',lv:0,no:0,date:new Date().toISOString().slice(0,10),mcq:ids.filter(i=>BYID[i].kind==='mcq').map(id=>({id,order:shuffle([0,1,2,3])})),short:ids.filter(i=>BYID[i].kind==='short'),match,essay:ids.filter(i=>BYID[i].kind==='essay'),ans:{}};
    renderNotes();setTimeout(()=>{const s=document.querySelectorAll('.sheet');s[s.length-1].scrollIntoView({behavior:'smooth'});},30);
  };
}
function noteEl(w){
  const q=BYID[w.id];const el=document.createElement('article');el.className='note';
  const isP=q.kind==='pair';
  const head=`<div class="note-h">${isP?personImg(q):''}<div class="nc"><div class="ntag">${TYPE_KO[w.type]||''} · ${q.lv?LVN[q.lv]+' · ':''}${esc(lecName(q.lec))} · p.${esc(q.p)} · ${w.n}회 틀림</div><h3 class="nconcept">${esc(q.c)}</h3></div><button class="nx" aria-label="오답노트에서 지우기" title="지우기">×</button></div>`;
  let body='';
  if(q.kind==='mcq')body=`<div class="note-b"><div class="ans-ok">정답 · ${esc(q.o[0])}</div><div>내 답 · <span class="ans-no">${esc(w.my||'')}</span></div><div class="ex">${esc(q.ex)}</div>${srcHTML(q.lec,q.p,q.qt)}<details><summary>문제 지문 보기</summary><p style="margin:6px 0 0">${esc(q.q)}</p>${q.stem?`<img class="stemimg" style="margin-left:0" src="img/${q.stem}.jpg" alt="">`:''}</details>${slideHTML(q)}</div>`;
  else if(q.kind==='short')body=`<div class="note-b"><div class="ans-ok">정답 · ${esc(q.ans)}</div><div>내 답 · <span class="ans-no">${esc(w.my||'')}</span></div><div class="ex">${esc(q.ex)}</div>${srcHTML(q.lec,q.p,q.qt)}<details><summary>문제 지문 보기</summary><p style="margin:6px 0 0">${esc(q.q)}</p></details>${slideHTML(q)}</div>`;
  else if(isP)body=`<div class="note-b"><div class="ans-ok">업적 · ${esc(q.ach)}</div>${w.my?`<div>내가 연결한 것 · <span class="ans-no">${esc(w.my)}</span></div>`:''}${srcHTML(q.lec,q.p,q.qt)}${slideHTML(q)}</div>`;
  else body=`<div class="note-b"><div><b style="color:var(--red)">빠뜨린 핵심 (${w.score??0}점)</b><ul class="misslist">${(w.miss||[]).map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div><details><summary>모범 답안 보기</summary><div class="model" style="margin-top:6px">${esc(q.model)}</div></details><details><summary>내가 쓴 답안 보기</summary><div class="mine" style="margin-top:6px">${esc(w.my||'')}</div></details>${q.quotes.map(x=>srcHTML(x[0],x[1],x[2])).join('')}<details><summary>문제 지문 보기</summary><p style="margin:6px 0 0">${esc(q.q)}</p></details></div>`;
  el.innerHTML=head+body+'<div data-c></div>';
  el.querySelector('.nx').onclick=()=>{const c=el.querySelector('[data-c]');c.innerHTML=`<div class="confirm"><span>"${esc(q.c)}" 항목을 오답노트에서 지울까요?</span><button class="btn sm danger" data-y>지우기</button><button class="btn sm ghost" data-n>취소</button></div>`;c.querySelector('[data-n]').onclick=()=>c.innerHTML='';c.querySelector('[data-y]').onclick=()=>{removeWrong(w.id);renderNotes();};};
  return el;
}

/* ======================= MATERIALS ======================= */
let unlockedKey=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(MANIFEST.salt),iterations:MANIFEST.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decryptBuf(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));}
const fmtMB=n=>(n/1048576).toFixed(1)+' MB';
function renderMaterials(){
  const app=$('#app');const entries=Object.entries(MANIFEST.files);
  const cov={};[...MCQ,...SHORT,...ESSAY,...PEOPLE].forEach(q=>{cov[q.lec]=(cov[q.lec]||0)+1;if(q.w)cov.WRx=(cov.WRx||0)+1;if(q.n)cov.NTx=(cov.NTx||0)+1;});
  app.innerHTML=`<section class="sheet">
    <div class="exam-head"><div class="t"><small>GCT501 · Course Materials</small><h1>강의자료</h1></div>
      <div class="meta"><div>파일</div><div>${entries.length}개 PDF</div><div>보호</div><div>AES-256 암호화</div><div>상태</div><div>${unlockedKey?'잠금 해제됨':'잠김'}</div></div></div>
    <p class="instr">PDF는 비밀번호로 암호화되어 있습니다. 비밀번호를 넣으면 브라우저 안에서 풀어 바로 내려받습니다. 슬라이드 내용과 페이지 번호는 원본과 같고, 용량 때문에 사진 해상도만 낮췄습니다.</p>
    ${unlockedKey?'':`<form class="lock" id="lockf"><label for="pw" style="font-weight:700">비밀번호</label><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호 입력"><button class="btn" type="submit">잠금 해제</button><span class="msg" id="pwmsg" aria-live="polite"></span></form>`}
    <ul class="files">${entries.map(([code,f])=>`<li><span class="code">${code}</span><div class="fn"><b>${esc(lecName(code))}</b><span>${esc(f.name)} · ${fmtMB(f.size)} · 문항 ${cov[code]||0}개</span><span class="msg" data-st="${code}"></span></div><button class="btn sm ${unlockedKey?'':'ghost'}" data-dl="${code}" ${unlockedKey?'':'disabled'}>${unlockedKey?'다운로드':'잠김'}</button></li>`).join('')}</ul>
    <div class="part"><h2>출제 범위</h2><span>Wrap-up 태그 ${cov.WRx||0}개 · 강의노트 태그 ${cov.NTx||0}개</span></div>
    <div class="cover">${Object.keys(LEC).map(k=>`<div><b>${k}</b> ${cov[k]||0}문항</div>`).join('')}</div>
  </section>`;
  const f=$('#lockf');
  if(f)f.onsubmit=async ev=>{ev.preventDefault();const pw=$('#pw').value,m=$('#pwmsg');if(!pw){m.className='msg no';m.textContent='비밀번호를 입력하세요.';return;}m.className='msg';m.textContent='확인 중…';
    try{const key=await deriveKey(pw);if(new TextDecoder().decode(await decryptBuf(key,b64(MANIFEST.check)))!=='GCT501-OK')throw 0;unlockedKey=key;renderMaterials();}catch(e){m.className='msg no';m.textContent='비밀번호가 맞지 않습니다. 다시 입력해 주세요.';$('#pw').select();}};
  app.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>download(b.dataset.dl,b));
}
async function download(code,btn){
  const info=MANIFEST.files[code],st=document.querySelector(`[data-st="${code}"]`);btn.disabled=true;st.className='msg';
  try{const parts=[];for(let i=0;i<info.parts.length;i++){st.textContent=` · 내려받는 중 ${i+1}/${info.parts.length}`;const r=await fetch(info.parts[i]);if(!r.ok)throw 0;parts.push(new Uint8Array(await decryptBuf(unlockedKey,await r.arrayBuffer())));}
    const u=URL.createObjectURL(new Blob(parts,{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download=info.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
    st.className='msg ok';st.textContent=' · 저장했습니다';}catch(e){st.className='msg no';st.textContent=' · 다운로드하지 못했습니다. 잠시 후 다시 시도해 주세요.';}
  btn.disabled=false;
}

/* ======================= BOOT ======================= */
if(ST.current){const c=ST.current;const ok=c.mcq&&c.mcq.every(i=>BYID[i.id])&&c.short.every(i=>BYID[i])&&c.essay.every(i=>BYID[i])&&c.match.every(m=>m.ids.every(i=>BYID[i])&&m.right.every(i=>BYID[i]));if(!ok)ST.current=null;}
render();
</script>
